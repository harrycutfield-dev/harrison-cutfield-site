<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 150" width="120" height="150" role="img" aria-label="Ray White">
  <defs>
    <filter id="fsh" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity="0.32"/>
    </filter>
  </defs>
  <!-- hanging flag: yellow body with a notched (swallowtail) bottom -->
  <g filter="url(#fsh)">
    <path d="M0 0 H120 V120 L60 150 L0 120 Z" fill="#FFE512"/>
  </g>
  <!-- wordmark, lower-left, dark ink, matching Ray White lockup -->
  <text x="14" y="86" font-family="'Lato','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="26" letter-spacing="-0.5" fill="#141414">Ray</text>
  <text x="14" y="112" font-family="'Lato','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="26" letter-spacing="-0.5" fill="#141414">White<tspan font-size="11" dy="-12">&#174;</tspan></text>
</svg>
